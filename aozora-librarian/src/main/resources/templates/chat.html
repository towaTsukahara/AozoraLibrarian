<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>青空図書館</title>
    <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>
<body>
    <header>
        <h1>青空図書館</h1>
        <p class="subtitle" th:text="'― ' + ${character.name} + 'と語る ―'">― 司書と語る ―</p>
    </header>

    <div class="chat-container">
        <!-- 履歴がない場合 -->
        <div th:if="${messages.isEmpty()}" class="empty-state">
            <p>司書がお待ちしております。お気軽にお声がけください。</p>
        </div>

        <!-- 履歴ループ -->
        <div th:each="msg : ${messages}"
             th:class="'message ' + (${msg.user} ? 'user' : 'assistant')">
            <div class="label">
                <span th:text="${msg.user} ? 'あなた' : ${character.name}"></span>
                <span th:text="' · ' + ${msg.timeLabel}"></span>
            </div>
            <div class="bubble" th:text="${msg.content}"></div>
        </div>
    </div>

    <div class="input-area">
        <form action="/chat" method="post" id="chatForm">
            <textarea name="message"
                      id="messageInput"
                      placeholder="司書に話しかけてください…"
                      required></textarea>
            <button type="submit" id="sendButton">送信</button>
        </form>
    </div>

    <script th:src="@{/js/chat.js}"></script>
</body>
</html>

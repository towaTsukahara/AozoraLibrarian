spring.application.name=aozora-librarian
server.port=8080

#LMStudio設定
spring.ai.openai.api-key=lm-studio
spring.ai.openai.base-url=http://localhost:1234
spring.ai.openai.chat.options.model=google/gemma-4-e4b
spring.ai.openai.chat.options.temperature=0.7

#HTTP/1.1強制　(LMStudioはHTTP/2非対応のため必須)
spring.http.client.factory=simple

#ログ
logging.level.org.springframework.ai=INFO
logging.level.org.springframework.web.client=INFO

#開発中はテンプレートをキャッシュしない
spring.thymeleaf.cache=false

#DB設定
spring.datasource.url=jdbc:postgresql://localhost:5432/aozora_librarian
spring.datasource.username=aozora_user
spring.datasource.password=aozora_pass
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA設定
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Flyway設定
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true